# ============================================================
# SCLAlertView 云端自动打包工作流
# 放到仓库的 .github/workflows/scl-build.yml
#
# 重要：本工作流只做一件事 —— 运行 python3 worker.py。
# 它【不会】执行 xcodebuild -list，也不需要仓库根目录有 Xcode 工程。
# 如果你在日志里看到 "xcodebuild -list" 或 Ruby JSON 解析报错，
# 说明跑的是别的工作流，请把 .github/workflows/ 里其它文件删掉。
# ============================================================

name: SCL Dylib Auto Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: '任务ID（留空自动领取队列第一个）'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'

# 同一时间只跑一个，避免并发抢任务
concurrency:
  group: scl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 环境自检（失败会明确告诉你缺什么）
        run: |
          echo "当前目录: $(pwd)"
          echo "========== 仓库根目录 =========="
          ls -la
          echo "========== .github/workflows =========="
          ls -la .github/workflows || true
          echo "========== 检查必需文件 =========="
          if [ ! -f worker.py ]; then
            echo "::error::仓库根目录缺少 worker.py（应在上传包 GITHUB-repo-upload.zip 里）"
            exit 1
          fi
          if [ ! -d sdk_src ]; then
            echo "::error::仓库根目录缺少 sdk_src 目录"
            exit 1
          fi
          echo "worker.py 和 sdk_src 存在，开始构建"
          ls -la sdk_src | head -50

      - name: 运行构建 worker
        env:
          SCL_BASE_URL: ${{ secrets.SCL_BASE_URL }}
          SCL_WORKER_TOKEN: ${{ secrets.SCL_WORKER_TOKEN }}
          SCL_JOB_ID: ${{ github.event.inputs.job_id }}
          SCL_ONCE: '1'
        run: python3 worker.py
