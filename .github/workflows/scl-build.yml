name: SCL Dylib Auto Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: '任务ID（可留空）'
        required: false
        default: ''
      base_url:
        description: '临时覆盖站点地址（可留空，优先用 Secret）'
        required: false
        default: ''
      worker_token:
        description: '临时覆盖 Worker Token（可留空，优先用 Secret）'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: scl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 检查文件与密钥
        env:
          SCL_BASE_URL: ${{ github.event.inputs.base_url || secrets.SCL_BASE_URL }}
          SCL_WORKER_TOKEN: ${{ github.event.inputs.worker_token || secrets.SCL_WORKER_TOKEN }}
        run: |
          ls -la
          test -f worker.py || { echo "::error::仓库根目录缺少 worker.py"; exit 1; }
          test -d sdk_src   || { echo "::error::仓库根目录缺少 sdk_src 目录"; exit 1; }
          if [ -z "$SCL_BASE_URL" ]; then
            echo "::error::SCL_BASE_URL 为空。请在仓库 Settings > Secrets and variables > Actions 新建 Secret：SCL_BASE_URL = 你的站点根地址（https://你的域名，不要带 /admin 或 /api）"
            exit 1
          fi
          if [ -z "$SCL_WORKER_TOKEN" ]; then
            echo "::error::SCL_WORKER_TOKEN 为空。请先到 PHP 后台「构建节点设置」生成并保存 Token，再到 GitHub 新建同名 Secret"
            exit 1
          fi
          echo "base_url = $SCL_BASE_URL"
          echo "token_length = ${#SCL_WORKER_TOKEN}"

      - name: 运行构建 worker
        env:
          SCL_BASE_URL: ${{ github.event.inputs.base_url || secrets.SCL_BASE_URL }}
          SCL_WORKER_TOKEN: ${{ github.event.inputs.worker_token || secrets.SCL_WORKER_TOKEN }}
          SCL_JOB_ID: ${{ github.event.inputs.job_id }}
          SCL_ONCE: '1'
        run: python3 worker.py
